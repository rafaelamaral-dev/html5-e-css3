<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse; /* Remove espaços entre as bordas */
        }

        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center; /* Alinhamento Horizontal */
            vertical-align: middle; /* Alinhamento Vertical */

        }


    </style>
</head>
<body>
    <h1>Minha Primeira Tabela</h1>
    <!-- 

        HIERARQUIA DAS TABELAS (simples)
        Table - tabela
            Table Row - linha da tabela (tr)
                Table Header - cabeçalho da tabela (th)
                Table Data - dado da tabela (td)



    -->
    <table>
        <tr> <!-- table row - linha da tabela (primeira linha) -->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr> <!-- table row - linha da tabela (segunda linha) -->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr> <!-- table row - linha da tabela (terceira linha) -->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td> <!-- table row - linha da tabela (quarta linha) -->
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
    
</body>
</html>
