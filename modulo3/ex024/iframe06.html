<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Adicionando Conteúdos</title>
        <style>
            .iframe-container {
                width: 100%;
                max-width: 800px;
                aspect-ratio: 16/9;
                margin: 0 auto;
                position: relative;
                display: block;
            }
            .iframe-container iframe {
                width: 100%;
                height: 100%;
                border: 0;
                position: absolute;
                top: 0;
                left: 0;
            }
        </style>
</head>
<body>
    <h1>Conteúdos dentro de iframes</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Natus cum quia provident, hic ea suscipit neque quaerat dicta ad ullam? At animi magnam voluptas illum dicta fugit eos nostrum voluptate.</p>
        <h2>Vídeos</h2>
        <div class="iframe-container">
            <iframe src="https://www.youtube.com/embed/Bl1FOKpFY2Q?si=nVjdcUX9fiDqy86_" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <h2>Mapas do Google</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3675.3027370051536!2d-43.17650043281859!3d-22.90220202305642!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x997f58a6a00a9d%3A0x3f251d85272f76f7!2sHostnet%20Internet!5e0!3m2!1spt-BR!2sbr!4v1758104804295!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

        <h2>Mapas do Waze</h2>
        <iframe src="https://embed.waze.com/iframe?zoom=15&lat=-23.532101&lon=-46.216307&ct=livemap" width="600" height="450" allowfullscreen></iframe>

        <h2>Apresentação do Google Docs</h2>

        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vT-s9IKiJpVbvvBFiZ4EjhjZReIigXiQBuXx9Ta6xQi1BW0ubgo6wtXTWs9eR5UIA/pubembed?start=false&loop=false&delayms=3000" frameborder="0" width="640" height="389" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>


</body>
</html>
