<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>

    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px dashed black;
        }
    </style>

    <!-- OBS: As configurações de CSS são predominantes para dimensão do iframe. 1º CSS, 2º Dimensão na própria iframe, 3º Dimensão padrão de 300 x 150 px -->
</head>
<body>
    <h1>Testando o uso de iframes</h1>
    <p>Acessando o site do 

        <!-- Tamanho padrão 300 x 150 px -->
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" height="500" scrolling="yes"><a href="https://www.cursoemvideo.com/" target="_blank">Curso em Vídeo</a></iframe>
        <!-- O atributo scrolling="yes" adiciona uma barra de rolagem ao iframe, caso o conteúdo seja maior que o tamanho do iframe -->

    para aprender a programar.</p>

    <p>O site do <iframe src="https://www.google.com/?zx=1757694638288&no_sw_cr=1" frameborder="0"></iframe> também é muito legal, pena que não funciona dentro do iframe!</p> <!-- o atributo frameborder="0" remove a borda do iframe -->
    <!-- OBS: Alguns sites não permitem serem carregados em iframes por questões de segurança. -->

    <p>
        O repositório do Guanabara
        <iframe src="https://gustavoguanabara.github.io/" frameborder="0" height="500" width="500"><a href="https://gustavoguanabara.github.io/" target="_blank">no GitHub</a></iframe>
        também é bem interessante.
    </p>
</body>
</html>
