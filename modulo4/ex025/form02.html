<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="Iusu">Usuário: </label>
            <input type="text" name="usu" id="Iusu" required minlength="5" maxlength="15" placeholder="Digite seu usuário" size="10"autocomplete="username">
        </p>
        <p>
            <label for="Isen">Senha: </label>
            <input type="password" name="sen" id="Isen" required minlength="8" maxlength="12" placeholder="Digite sua senha" size="8" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
    
</body>
</html>
